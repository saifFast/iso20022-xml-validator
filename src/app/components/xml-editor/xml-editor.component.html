<div class="upload-box">
  <h2>📁 Upload XML File</h2>
  <input type="file" accept=".xml" (change)="onFileSelected($event)" aria-label="Upload XML file"/>
  <p class="help-text">Select an XML file from your computer (Max 5MB)</p>
</div>

<div class="divider">OR</div>

<div class="paste-box">
  <h2>📝 Paste XML Content</h2>
  <textarea [value]="xmlContent" (input)="onXmlInput($event)" placeholder="Paste your XML content here..." rows="12" aria-label="XML content input"></textarea>
  <p class="help-text">Paste your ISO 20022 PACS.008 XML message</p>
</div>

<button (click)="validate.emit()" [disabled]="!xmlContent || isValidating" class="validate-btn" type="button">
  @if (isValidating) { ⏳ Validating... } @else { ✓ Validate XML }
</button>
