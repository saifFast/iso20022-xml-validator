<div class="validator-container">
  <header class="header">
    <div class="header-content">
      <div class="logo-section">
        <svg class="logo" viewBox="0 0 40 40" width="40" height="40">
          <rect x="2" y="2" width="36" height="36" rx="8" fill="#1D9BF0" stroke="#1D9BF0" stroke-width="2"/>
          <g fill="#FFFFFF" opacity="0.95">
            <path d="M 12 10 Q 14 12 16 10 Q 18 12 20 10 Q 22 12 24 10 L 24 15 Q 22 17 20 15 Q 18 17 16 15 Q 14 17 12 15 Z"/>
            <circle cx="20" cy="22" r="3" fill="#1D9BF0" opacity="0.8"/>
            <path d="M 10 28 L 30 28 Q 30 32 26 34 L 14 34 Q 10 32 10 28 Z"/>
          </g>
        </svg>
        <div>
          <h1>PACS.008 Validator</h1>
          <p class="subtitle">ISO 20022 Payment Message Validation</p>
        </div>
      </div>
      <div class="created-by">by Saifullah Hakro</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-button" [class.active]="activeTab() === 'validate'" (click)="switchTab('validate')" type="button">✓ Validator</button>
    <button class="tab-button" [class.active]="activeTab() === 'samples'"  (click)="switchTab('samples')"  type="button">📚 Samples</button>
    <button class="tab-button" [class.active]="activeTab() === 'format'"   (click)="switchTab('format')"   type="button">🎨 Format</button>
    <button class="tab-button" [class.active]="activeTab() === 'history'"  (click)="switchTab('history')"  type="button">
      📋 History <span class="badge">{{ history().length }}</span>
    </button>
  </div>

  <div class="input-section">
    @if (errorMessage()) {
      <div class="error-banner">
        <span class="error-icon">⚠️</span>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (activeTab() === 'validate') {
      <app-xml-editor
        [xmlContent]="xmlContent()"
        [isValidating]="isValidating()"
        (xmlContentChange)="onXmlContentChange($event)"
        (fileError)="onFileError($event)"
        (validate)="onValidate()"
      />
      <app-validation-result
        [result]="validationResult()"
        (exportJson)="exportJson()"
        (exportCsv)="exportCsv()"
        (exportHtml)="exportHtml()"
        (copyXml)="copyXmlToClipboard()"
      />
    }

    @if (activeTab() === 'samples') {
      <app-sample-messages
        [samples]="samples"
        (sampleSelected)="loadSample($event)"
      />
    }

    @if (activeTab() === 'format') {
      <app-xml-formatter
        [xmlContent]="xmlContent()"
        (xmlContentChange)="xmlContent.set($event)"
        (formatterError)="errorMessage.set($event)"
      />
    }

    @if (activeTab() === 'history') {
      <app-validation-history
        [history]="history()"
        [stats]="historyStats()"
        (loadEntry)="loadFromHistory($event)"
        (deleteEntry)="deleteHistoryEntry($event)"
        (clearHistory)="clearHistory()"
      />
    }
  </div>
</div>
